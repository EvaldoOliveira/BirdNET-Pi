name: Bug
description: Something on the station or in the code behaves wrong
title: "Bug: <short title>"
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git -C ~/BirdNET-Pi rev-parse --short HEAD` and the station name
      placeholder: 063a24c · evaldo-sp
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u birdnet_analysis -u birdnet_recording -n 50`, UI errors, files involved — no secrets"
      render: shell
